<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Universities</title>
</head>
<body>

<h1>University List</h1>

<a href="/universities/new">Add New University</a>

<hr>

<form method="get" action="/universities">

    <label>Name:</label>
    <input type="text" name="name" th:value="${name}">

    <label>Sort by:</label>
    <select name="sortField">
        <option value="id">ID</option>
        <option value="name">Name</option>
    </select>

    <select name="sortDir">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
    </select>

    <button type="submit">Apply</button>
</form>

<hr>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="u : ${universities}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.name}"></td>

        <td>
            <a th:href="@{'/universities/' + ${u.id}}">Details</a> |
            <a th:href="@{'/universities/' + ${u.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/universities/' + ${u.id} + '/delete'}"
                  method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
