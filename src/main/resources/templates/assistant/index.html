<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assistants</title>
</head>
<body>

<h1>Assistant List</h1>

<a href="/assistants/new">Add New Assistant</a>

<hr>

<form method="get" action="/assistants">

    <label>Name:</label>
    <input type="text" name="name" th:value="${name}">

    <label>Role:</label>
    <select name="role">
        <option value="" th:selected="${role == ''}">-- Any --</option>
        <option value="LAB" th:selected="${role == 'LAB'}">LAB</option>
        <option value="TA" th:selected="${role == 'TA'}">TA</option>
        <option value="GRADER" th:selected="${role == 'GRADER'}">GRADER</option>
    </select>

    <label>Sort by:</label>
    <select name="sortField">
        <option value="id" th:selected="${sortField == 'id'}">ID</option>
        <option value="name" th:selected="${sortField == 'name'}">Name</option>
        <option value="phoneNumber" th:selected="${sortField == 'phoneNumber'}">Phone</option>
        <option value="role" th:selected="${sortField == 'role'}">Role</option>
    </select>

    <select name="sortDir">
        <option value="asc" th:selected="${sortDir == 'asc'}">Ascending</option>
        <option value="desc" th:selected="${sortDir == 'desc'}">Descending</option>
    </select>

    <button type="submit">Apply</button>
</form>

<hr>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone Number</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="a : ${assistants}">
        <td th:text="${a.id}"></td>
        <td th:text="${a.name}"></td>
        <td th:text="${a.phoneNumber}"></td>
        <td th:text="${a.role}"></td>
        <td>
            <a th:href="@{'/assistants/' + ${a.id}}">Details</a> |
            <a th:href="@{'/assistants/' + ${a.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/assistants/' + ${a.id} + '/delete'}"
                  method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
