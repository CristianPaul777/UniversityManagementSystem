<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enrollments</title>
</head>
<body>

<h1>Enrollment List</h1>

<a href="/enrollments/new">Add New Enrollment</a>

<hr>

<form method="get" action="/enrollments">

    <label>Student ID:</label>
    <input type="text" name="studentId" th:value="${studentId}">

    <label>Course ID:</label>
    <input type="text" name="courseId" th:value="${courseId}">

    <label>Sort by:</label>
    <select name="sortField" th:value="${sortField}">
        <option value="id">ID</option>
        <option value="grade">Grade</option>
    </select>

    <select name="sortDir" th:value="${sortDir}">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
    </select>

    <button type="submit">Apply</button>
</form>

<hr>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Student</th>
        <th>Course</th>
        <th>Grade</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="en : ${enrollments}">
        <td th:text="${en.id}"></td>
        <td th:text="${en.student != null ? en.student.id : 'N/A'}"></td>
        <td th:text="${en.course != null ? en.course.id : 'N/A'}"></td>
        <td th:text="${en.grade}"></td>

        <td>
            <a th:href="@{'/enrollments/' + ${en.id}}">Details</a> |
            <a th:href="@{'/enrollments/' + ${en.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/enrollments/' + ${en.id} + '/delete'}"
                  method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
